name: Web

# Web sürümü: test → derleme → (günlük) fiyat geçmişi kopyası → GitHub Pages (gh-pages dalı).
# Geçmiş kopyası her iş günü BIST kapanışından sonra yenilenir: aylık çubuklar (5 yıllık dip/zirve,
# ortalama F/K) ve günlük kapanışlar (geçmişte test). Statik yayında bu dosyalardan çalışır.
# Ardından hazır listelerin güvenilirlik skorları aynı kopyayla yeniden hesaplanır (data/scores.json).
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  schedule:
    - cron: '41 15 * * 1-5' # 18:41 TSİ
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Derle (statik yayın)
        run: npm run build
        env:
          VITE_HISTORY: snapshot
      - name: Fiyat geçmişi kopyası (TradingView, Yahoo yedek)
        # Yeni çekilemeyen semboller yayındaki önceki kopyadan korunur
        run: node scripts/snapshot.mjs dist/data "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/data"
        timeout-minutes: 12
        continue-on-error: true
      - name: Hazır listelerin güvenilirlik skorları (son 3 yıl)
        # Aynı motorla, yeni kopyadan; olmazsa yayındaki önceki skorlar korunur
        run: |
          LAB_DATA=dist/data LAB_CACHE="$RUNNER_TEMP/fundamentals.json" OUT=dist/data/scores.json npm run scores \
            || curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/data/scores.json" -o dist/data/scores.json \
            || echo "Skor üretilemedi"
        timeout-minutes: 10
        continue-on-error: true
      - name: 404 yönlendirmesi ve Jekyll'siz yayın
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: GitHub Pages (gh-pages dalı)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Web sürümü
