name: Web

# Web sürümü: test → derleme → (günlük) fiyat geçmişi kopyası → GitHub Pages (gh-pages dalı).
# Geçmiş kopyası her iş günü BIST kapanışından sonra yenilenir: aylık çubuklar (5 yıllık dip/zirve,
# ortalama F/K) ve günlük kapanışlar (geçmişte test). Statik yayında bu dosyalardan çalışır.
# Ardından hazır listelerin güvenilirlik skorları aynı kopyayla yeniden hesaplanır (data/scores.json).
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  schedule:
    - cron: '41 15 * * 1-5' # 18:41 TSİ
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Derle (statik yayın)
        run: npm run build
        env:
          VITE_HISTORY: snapshot
      - name: Fiyat geçmişi kopyası (TradingView, Yahoo yedek)
        # Yeni çekilemeyen semboller yayındaki önceki kopyadan korunur
        run: node scripts/snapshot.mjs dist/data "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/data"
        timeout-minutes: 20
        continue-on-error: true
      - name: Hisse analizi için pazar geneli kanıt (güçlü kurulumlar ve olayların tüm hisselerdeki sonucu)
        # Her yayında günlük kopyadan yeniden hesaplanır; olmazsa yayındaki kopya, o da yoksa depodaki dosya kalır
        run: |
          for f in setups market-events; do
            if [ -d dist/data/bars/D ] && DATA=dist/data/bars OUT=dist/data/$f.new.json npm run $f; then mv dist/data/$f.new.json dist/data/${f/market-events/events-market}.json
            else o=${f/market-events/events-market}; rm -f dist/data/$f.new.json; curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/data/$o.json" -o dist/data/$f.new.json && mv dist/data/$f.new.json dist/data/$o.json || rm -f dist/data/$f.new.json; fi
          done
        timeout-minutes: 6
        continue-on-error: true
      - name: Tepe ve taban örüntüsü (pazar genelinde öğrenme ve geriye dönük sınama)
        # Günlük kopyadan yeniden öğrenilir; olmazsa yayındaki kopya, o da yoksa depodaki dosya kalır
        run: |
          if [ -d dist/data/bars/D ] && [ -f dist/data/candles/VIX.json ] && DATA=dist/data/bars CANDLES=dist/data/candles OUT=dist/data/pivots.new.json npm run pivots; then mv dist/data/pivots.new.json dist/data/pivots.json
          else rm -f dist/data/pivots.new.json; curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/data/pivots.json" -o dist/data/pivots.new.json && mv dist/data/pivots.new.json dist/data/pivots.json || rm -f dist/data/pivots.new.json; fi
        timeout-minutes: 8
        continue-on-error: true
      - name: Görünümün hazır hâli (Android uygulaması için)
        run: |
          if [ -f dist/data/macro.json ] && DATA=dist/data/macro.json OUT=dist/data/outlook.new.json npm run outlook; then mv dist/data/outlook.new.json dist/data/outlook.json; else rm -f dist/data/outlook.new.json; fi
        timeout-minutes: 3
        continue-on-error: true
      - name: Hazır listelerin güvenilirlik skorları (son 3 yıl)
        # Aynı motorla, yeni kopyadan; olmazsa yayındaki önceki skorlar korunur
        run: |
          LAB_DATA=dist/data LAB_CACHE="$RUNNER_TEMP/fundamentals.json" OUT=dist/data/scores.json npm run scores \
            || curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/data/scores.json" -o dist/data/scores.json \
            || echo "Skor üretilemedi"
        timeout-minutes: 10
        continue-on-error: true
      - name: 404 yönlendirmesi ve Jekyll'siz yayın
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: GitHub Pages (gh-pages dalı)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Web sürümü
