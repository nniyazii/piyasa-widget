name: Web

# Web sürümü: test → derleme → (günlük) fiyat geçmişi kopyası → GitHub Pages (gh-pages dalı).
# Geçmiş kopyası her iş günü BIST kapanışından sonra yenilenir; dinamik listelerdeki
# 5 yıllık dip/zirve ve ortalama F/K koşulları statik yayında bu dosyalardan çalışır.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  schedule:
    - cron: '41 15 * * 1-5' # 18:41 TSİ
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Derle (statik yayın)
        run: npm run build
        env:
          VITE_HISTORY: snapshot
      - name: Fiyat geçmişi kopyası (Yahoo Finance)
        # Yeni çekilemeyen semboller yayındaki önceki kopyadan korunur
        run: node scripts/snapshot.mjs dist/data/history "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/data/history"
        timeout-minutes: 12
        continue-on-error: true
      - name: 404 yönlendirmesi ve Jekyll'siz yayın
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: GitHub Pages (gh-pages dalı)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Web sürümü
